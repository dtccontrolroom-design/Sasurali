<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <html>
<head>
  <title>Spice Garden Restaurant</title>
</head>
<body>

  <h1>Spice Garden Restaurant</h1>
  <p>Delicious food delivered to your door</p>
  <hr>

  <h2>Our Menu</h2>
  <ul>
    <li>Chicken Biryani – AED 15</li>
    <li>Veg Momos – AED 10</li>
    <li>Butter Chicken – AED 18</li>
  </ul>

  <h2>Place Your Order</h2>

  <form action="https://forms.gle/YEG67kybR92QpAJG9">
    
    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your name" required><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" placeholder="Enter your phone number" required><br><br>

    <label>Delivery Address:</label><br>
    <textarea placeholder="Enter your address" required></textarea><br><br>

    <label>Select Food:</label><br>
    <select>
      <option>Chicken Biryani</option>
      <option>Veg Momos</option>
      <option>Butter Chicken</option>
    </select><br><br>

    <label>Quantity:</label><br>
    <input type="number" value="1" min="1"><br><br>

    <label>Payment Method:</label><br>
    <input type="radio" checked> Cash on Delivery<br><br>

    <button type="submit">Submit Order</button>
  </form>

</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
